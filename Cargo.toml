[package]
name = "arrayglyph"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "APL-inspired, compile-time-shaped arrays for Rust, with glyph <-> verbose pretty-printing"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false
keywords = ["apl", "array", "const-generics", "dsl"]
categories = ["data-structures", "mathematics"]

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }

[[bin]]
name = "arrayglyph-fmt"
path = "src/bin/arrayglyph-fmt.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
